<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
    body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f4f9;
  color: #333;
  text-align: center;
}

header {
  background: #4CAF50;
  color: white;
  padding: 20px;
}

.search-box {
  margin: 20px;
}

input {
  padding: 10px;
  width: 250px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  padding: 10px 15px;
  margin-left: 10px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
button:hover {
  background: #45a049;
}

#destination-info, #photos, #weather {
  margin: 30px;
  padding: 20px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

#photo-gallery img {
  width: 200px;
  margin: 10px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
</style>
<script>
    // Replace with your API keys
const WEATHER_API_KEY = "0511de3b86721a3cddcdceaa1953b568";
const UNSPLASH_ACCESS_KEY = "XvvrV4oI05X9IyRLIj4rj-eP0w33YMB4kkeV6XAOFeU";

async function searchDestination() {
  const city = document.getElementById("cityInput").value.trim();
  if (!city) {
    alert("Please enter a city name");
    return;
  }

  // Display city name
  document.getElementById("cityName").innerText = `You searched for: ${city}`;

  // Fetch Weather
  try {
    const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${WEATHER_API_KEY}&units=metric`;
    const weatherRes = await fetch(weatherUrl);
    if (!weatherRes.ok) throw new Error("Weather not found");
    const weatherData = await weatherRes.json();

    document.getElementById("weather-data").innerHTML = `
      <p><strong>Condition:</strong> ${weatherData.weather[0].description}</p>
      <p><strong>Temperature:</strong> ${weatherData.main.temp} °C</p>
      <p><strong>Humidity:</strong> ${weatherData.main.humidity}%</p>
      <p><strong>Wind:</strong> ${weatherData.wind.speed} m/s</p>
    `;
  } catch (error) {
    document.getElementById("weather-data").innerHTML = `<p>⚠️ Could not fetch weather data.</p>`;
  }

  // Fetch Photos
  try {
    const photoUrl = `https://api.unsplash.com/search/photos?query=${city}&client_id=${UNSPLASH_ACCESS_KEY}&per_page=6`;
    const photoRes = await fetch(photoUrl);
    if (!photoRes.ok) throw new Error("Photos not found");
    const photoData = await photoRes.json();

    document.getElementById("photo-gallery").innerHTML = photoData.results
      .map(img => `<img src="${img.urls.small}" alt="${city}">`)
      .join('');
  } catch (error) {
    document.getElementById("photo-gallery").innerHTML = `<p>⚠️ Could not load photos.</p>`;
  }
}
</script>
<body>
  <header>
    <h1>🌍 Trip Planner</h1>
    <p>Explore destinations, view photos, and check the weather</p>
  </header>

  <main>
    <section class="search-box">
      <input type="text" id="cityInput" placeholder="Enter a city...">
      <button onclick="searchDestination()">Search</button>
    </section>

    <section id="destination-info">
      <h2>Destination Info</h2>
      <p id="cityName">Search for a city to see details.</p>
    </section>

    <section id="photos">
      <h2>Photos</h2>
      <div id="photo-gallery"></div>
    </section>

    <section id="weather">
      <h2>Weather</h2>
      <div id="weather-data"></div>
    </section>
  </main>

  
</body>
</html>
